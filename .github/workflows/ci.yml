name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: ruff check src tests
      - run: python -m pytest

  firmware:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/firmware/esp32
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('apps/firmware/esp32/platformio.ini') }}
      - run: python -m pip install platformio
      - run: pio test -e native
      - run: cp include/secrets.example.hpp include/secrets.hpp
      - run: pio run -e esp32dev
