[platformio]
src_dir = src
include_dir = include
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
lib_deps =
  bblanchon/ArduinoJson @ ^7.2.0
build_flags =
  -D CORE_DEBUG_LEVEL=3
test_ignore = *

; Host-side unit tests for lib/firesight_core: `pio test -e native`
[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17
